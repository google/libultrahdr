name: Daily Regression Matrix & Auto-Triage

on:
  schedule:
    # Runs every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  regression-matrix:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # --- Linux Configurations ---
          - name: "Linux GCC (HEIF ON)"
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            cmake-opts: "-DUHDR_BUILD_TESTS=1 -DUHDR_BUILD_DEPS=1 -DUHDR_ENABLE_HEIF=1 -DUHDR_ENABLE_WERROR=1"
            enable_heif: "ON"

          - name: "Linux Clang ASan/UBSan (HEIF ON)"
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            cmake-opts: "-DUHDR_BUILD_TESTS=1 -DUHDR_BUILD_DEPS=1 -DUHDR_ENABLE_HEIF=1 -DUHDR_SANITIZE_OPTIONS=address,undefined -DUHDR_ENABLE_WERROR=1"
            enable_heif: "ON"

          - name: "Linux Clang (HEIF OFF - JPEG Only)"
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            cmake-opts: "-DUHDR_BUILD_TESTS=1 -DUHDR_BUILD_DEPS=1 -DUHDR_ENABLE_HEIF=0 -DUHDR_ENABLE_WERROR=1"
            enable_heif: "OFF"

          # --- macOS Configurations ---
          - name: "macOS Apple Silicon (HEIF ON)"
            os: macos-14
            cc: clang
            cxx: clang++
            cmake-opts: "-DUHDR_BUILD_TESTS=1 -DUHDR_BUILD_DEPS=1 -DUHDR_ENABLE_HEIF=1 -DUHDR_ENABLE_WERROR=1"
            enable_heif: "ON"

          # --- Windows Configurations ---
          - name: "Windows MSVC 2022 (HEIF OFF)"
            os: windows-latest
            cc: cl
            cxx: cl
            cmake-opts: "-DUHDR_BUILD_TESTS=1 -DUHDR_BUILD_DEPS=1 -DUHDR_ENABLE_HEIF=0 -DUHDR_ENABLE_WERROR=1"
            enable_heif: "OFF"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 50

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@7e868db0f3406270dd46e1dac26c65f621456723 # master

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@802fa1a2c4e212495c05bf94dba2704a92a472be # v2.0.2

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libjpeg-dev pkg-config yasm

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install yasm pkg-config || true

      - name: Configure CMake
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          MATRIX_CC: ${{ matrix.config.cc }}
          MATRIX_CXX: ${{ matrix.config.cxx }}
          MATRIX_CMAKE_OPTS: ${{ matrix.config.cmake-opts }}
        run: |
          if [ "$RUNNER_OS_NAME" != "Windows" ]; then
            export CC="$MATRIX_CC"
            export CXX="$MATRIX_CXX"
            cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release $MATRIX_CMAKE_OPTS
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release $MATRIX_CMAKE_OPTS
          fi

      - name: Build Targets
        shell: bash
        run: |
          cmake --build build --config Release

      - name: Execute Regression Test Suite
        id: run_tests
        working-directory: build
        shell: bash
        run: |
          set -o pipefail
          export DYLD_LIBRARY_PATH="$(pwd)/libheif/src/libheif-build/libheif:$DYLD_LIBRARY_PATH"
          export LD_LIBRARY_PATH="$(pwd)/libheif/src/libheif-build/libheif:$LD_LIBRARY_PATH"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ctest --output-on-failure --build-config Release -R UHDRUnitTests 2>&1 | tee test_output.log
          else
            ./ultrahdr_unit_test 2>&1 | tee test_output.log
          fi

      - name: Report Regression Issue (On Failure)
        if: failure() && steps.run_tests.outcome == 'failure'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MATRIX_OS: ${{ matrix.config.os }}
          MATRIX_CC: ${{ matrix.config.cc }}
          MATRIX_CMAKE_OPTS: ${{ matrix.config.cmake-opts }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          LOG_FILE="build/test_output.log"
          if [ ! -f "$LOG_FILE" ]; then LOG_FILE="test_output.log"; fi
          python3 scripts/report_regression_issue.py \
            --log-file "$LOG_FILE" \
            --os "$MATRIX_OS" \
            --compiler "$MATRIX_CC" \
            --config "$MATRIX_CMAKE_OPTS" \
            --repo "$GITHUB_REPO" \
            --token "$GITHUB_TOKEN" \
            --run-url "$GITHUB_RUN_URL"

      - name: Upload Test Failure Logs
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: regression-logs-${{ matrix.config.name }}
          path: |
            build/test_output.log
            test_output.log
