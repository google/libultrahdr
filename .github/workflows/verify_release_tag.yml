name: Verify Release Tag & Version Consistency

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - 'release/**'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'ultrahdr_api.h'
      - 'scripts/verify_tag_and_version.py'
      - '.github/workflows/verify_release_tag.yml'

permissions:
  contents: read

jobs:
  verify-version-consistency:
    name: Verify Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.x'

      - name: Verify Version Consistency
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
            echo "Verifying release tag: ${TAG_NAME}"
            python3 scripts/verify_tag_and_version.py --tag "${TAG_NAME}"
          else
            echo "Verifying in-tree version consistency between CMakeLists.txt and ultrahdr_api.h"
            python3 scripts/verify_tag_and_version.py
          fi
